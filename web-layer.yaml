---
- name: Deploy Web Layer (Nginx)
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Create Nginx ConfigMap
      kubernetes.core.k8s:
        state: present
        namespace: "{{ target_namespace }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: nginx-config
          data:
            default.conf: |
              server {
                  listen 80;
                  server_name localhost;

                  location / {
                      root /usr/share/nginx/html;
                      index index.html;
                  }

                  location /db-check {
                      proxy_pass http://postgres-service:5432;
                  }
              }

    - name: Deploy Nginx Web Deployment
      kubernetes.core.k8s:
        state: present
        namespace: "{{ target_namespace }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nginx-deployment
            labels:
              app: nginx
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: nginx
            template:
              metadata:
                labels:
                  app: nginx
              spec:
                containers:
                  - name: nginx
                    image: nginx:alpine
                    ports:
                      - containerPort: 80
                    volumeMounts:
                      - name: config-volume
                        mountPath: /etc/nginx/conf.d
                volumes:
                  - name: config-volume
                    configMap:
                      name: nginx-config

    - name: Deploy Nginx Service
      kubernetes.core.k8s:
        state: present
        namespace: "{{ target_namespace }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: nginx-service
          spec:
            type: NodePort
            ports:
              - port: 80
                targetPort: 80
                nodePort: 30080
            selector:
              app: nginx
