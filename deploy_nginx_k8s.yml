# deploy_nginx_k8s.yml
---
- name: Deploy Nginx Web Application to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    k8s_namespace: web-app
    app_name: nginx-demo

  tasks:
    - name: Ensure Kubernetes Namespace exists
      kubernetes.core.k8s:
        name: "{{ k8s_namespace }}"
        api_version: v1
        kind: Namespace
        state: present

    - name: Deploy Nginx Deployment
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ app_name }}"
            namespace: "{{ k8s_namespace }}"
          spec:
            replicas: {{ replicas }}
            selector:
              matchLabels:
                app: nginx-demo
            template:
              metadata:
                labels:
                  app: nginx-demo
              spec:
                containers:
                  - name: nginx
                    image: nginx:latest
                    ports:
                      - containerPort: 80

    - name: Expose Nginx via NodePort Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ app_name }}-service"
            namespace: "{{ k8s_namespace }}"
          spec:
            type: NodePort
            selector:
              app: nginx-demo
            ports:
              - port: 80
                targetPort: 80
                nodePort: 30080
